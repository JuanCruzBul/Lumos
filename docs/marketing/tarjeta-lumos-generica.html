<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Tarjeta Lumos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  @page { size: 90mm 50mm; margin: 0; }

  html, body {
    font-family: 'Quicksand', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  .card {
    width: 90mm;
    height: 50mm;
    position: relative;
    overflow: hidden;
    page-break-after: always;
  }

  .card:last-child { page-break-after: auto; }

  /* ===== FRONT — cream ===== */
  .front {
    background: #f3ede2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 10mm;
  }

  .front .logo-mark {
    width: 24mm;
    height: 24mm;
  }

  .front .wordmark {
    margin-top: 3mm;
    font-size: 23pt;
    font-weight: 600;
    color: #b5623a;
    letter-spacing: 0.5px;
    text-align: center;
  }

  /* ===== BACK — copper gradient ===== */
  .back {
    background: linear-gradient(150deg, #d69466 0%, #b3603a 55%, #93462a 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 7mm 8mm;
  }

  .back .glow-wrap {
    position: absolute;
    top: -14mm;
    left: -10mm;
    width: 50mm;
    height: 50mm;
  }

  .back .glow-core {
    position: absolute;
    top: 19mm;
    left: 19mm;
    width: 17mm;
    height: 17mm;
    border-radius: 50%;
    background: #ffe4a8;
    box-shadow:
      0 0 5mm 3mm rgba(255, 240, 210, 0.9),
      0 0 10mm 6mm rgba(255, 216, 140, 0.75),
      0 0 20mm 12mm rgba(255, 195, 100, 0.5),
      0 0 32mm 20mm rgba(255, 175, 80, 0.28);
  }

  .back .contact {
    position: relative;
    z-index: 2;
    color: rgba(255,255,255,0.95);
    font-size: 8pt;
    line-height: 1.75;
    margin-top: auto;
  }

  .back .wordmark {
    position: relative;
    z-index: 2;
    align-self: flex-end;
    font-size: 11pt;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<!-- ===================== FRENTE ===================== -->
<div class="card front">
  <svg class="logo-mark" viewBox="7500 7800 13500 13500" xmlns="http://www.w3.org/2000/svg">

  <div class="wordmark">lumos</div>
</div>

<!-- ===================== DORSO ===================== -->
<div class="card back">
  <div class="glow-wrap">
    <div class="glow-core"></div>
  </div>
  <div></div>
  <div class="contact">
    lumosdomotica@gmail.com<br/>
    lumos.net.ar
  </div>
  <div class="wordmark">lumos</div>
</div>

</body>
</html>
