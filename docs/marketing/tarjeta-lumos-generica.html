<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Tarjeta Lumos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  @page { size: 90mm 50mm; margin: 0; }

  html, body {
    font-family: 'Quicksand', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  .card {
    width: 90mm;
    height: 50mm;
    position: relative;
    overflow: hidden;
    page-break-after: always;
  }

  .card:last-child { page-break-after: auto; }

  /* ===== FRONT — cream ===== */
  .front {
    background: #f3ede2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 10mm;
  }

  .front .logo-mark {
    width: 24mm;
    height: 24mm;
  }

  .front .wordmark {
    margin-top: 0.5mm;
    font-size: 23pt;
    font-weight: 600;
    color: #b5623a;
    letter-spacing: 0.5px;
    text-align: center;
    line-height: 1;
  }

  .front .tagline {
    margin-top: 0.5mm;
    font-size: 7.5pt;
    font-weight: 600;
    color: #b5623a;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: center;
    opacity: 0.75;
  }

  .front .dot {
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(1.3);
  }

  /* ===== BACK — copper gradient ===== */
  .back {
    background: #c5704b;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 7mm 8mm;
  }

  .back .glow-core {
    position: absolute;
    top: 50%;
    left: 22.5mm;
    transform: translate(-50%, -50%);
    width: 11mm;
    height: 11mm;
    border-radius: 50%;
    background: #ffc35c;
    box-shadow:
      0 0 5mm 2.5mm rgba(255, 195, 92, 0.4),
      0 0 11mm 6mm rgba(255, 202, 110, 0.24),
      0 0 18mm 10mm rgba(255, 190, 90, 0.12);
  }

  .back .contact {
    position: relative;
    z-index: 2;
    align-self: flex-end;
    max-width: 46mm;
    text-align: left;
    color: rgba(255,255,255,0.95);
    font-size: 6.6pt;
    line-height: 1.65;
  }

  .back .names {
    font-weight: 600;
    color: #ffffff;
    font-size: 6.9pt;
  }

  .back .wordmark {
    position: relative;
    z-index: 2;
    align-self: flex-end;
    font-size: 11pt;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<!-- ===================== FRENTE ===================== -->
<div class="card front">
  <svg class="logo-mark" viewBox="7500 7800 13500 13500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="dot-glow-front" x="-500%" y="-500%" width="1100%" height="1100%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="380" result="blur0"/>
        <feFlood flood-color="#FFB347" flood-opacity="0.9" result="color0"/>
        <feComposite in="color0" in2="blur0" operator="in" result="glow0"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="180" result="blur1"/>
        <feFlood flood-color="#FFDA9C" flood-opacity="1" result="color1"/>
        <feComposite in="color1" in2="blur1" operator="in" result="glow1"/>
        <feMerge>
          <feMergeNode in="glow0"/>
          <feMergeNode in="glow1"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <g filter="url(#dot-glow-front)">
      <path class="dot" fill="#ffb347" d="M14089.28 13741.26c-523.12,189.24 -226.03,917.72 264.86,745.2 465.91,-163.74 232.65,-925.16 -264.86,-745.2z"/>
    </g>
  </svg>
  <div class="wordmark">Lumos</div>
  <div class="tagline">Hogares Inteligentes</div>
</div>

<!-- ===================== DORSO ===================== -->
<div class="card back">
  <div class="glow-core"></div>
  <div class="wordmark">Lumos</div>
  <div class="contact">
    <span class="names">Juan Cruz Bulatovich<br/>Jesús Manuel Martínez</span><br/>
    lumosdomotica@gmail.com<br/>
    lumos.net.ar · 3541 598686
  </div>
</div>

</body>
</html>
